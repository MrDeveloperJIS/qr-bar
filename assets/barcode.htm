<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon/barcode.svg" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="bar-code/barcode.js"></script>
    <title>Bar Code Generator</title>
</head>

<body>

    <div id="box"></div>

    <div id="set">

        <a id="op1" class="opt" href="#">Show settings</a>
        <a id="op2" class="opt" href="#">Hide settings</a>

        <div class="legend">

            <h3>BARCODE SETTINGS</h3>

        </div>

        <table>
            <tr>
                <th>

                    <label for="in1">Width</label>
                </th>
                <td><input id="in1" type="number" value="320" min="256" max="1024" step="256" /></td>
            </tr>
            <tr>
                <th>

                    <label for="in2">Auto Width</label>
                </th>
                <td><input id="in2" type="checkbox" /></td>
            </tr>
            <tr>
                <th>

                    <label for="in3">Height</label>
                </th>
                <td><input id="in3" type="number" value="80" min="64" max="256" step="32" /></td>
            </tr>
            <tr>
                <th>

                    <label for="in4">Auto Height</label>
                </th>
                <td><input id="in4" type="checkbox" /></td>
            </tr>
            <tr>
                <th>

                    <label for="in5">Padding x</label>
                </th>
                <td><input id="in5" type="number" value="20" min="2" max="64" step="2" /></td>
            </tr>
            <tr>
                <th>

                    <label for="in6">Padding Y</label>
                </th>
                <td><input id="in6" type="number" value="16" min="2" max="64" step="2" /></td>
            </tr>
            <tr>
                <th>

                    <label for="in7">Faces</label>
                </th>
                <td><input id="in7" type="color" value="#000000" /></td>
            </tr>
            <tr>
                <th>

                    <label for="in8">Background color</label>
                </th>
                <td><input id="in8" type="color" value="#ffffff" /></td>
            </tr>
            <tr>
                <th>

                    <label for="in9">Background opaque</label>
                </th>
                <td><input id="in9" type="checkbox" /></td>
            </tr>
            </tr>
        </table>

    </div>

    <div id="txt"><textarea id="msg"></textarea></div>

    <div id="hnt">
        <pre id="res"></pre>
    </div>

    <script src="bar-code/script.js"></script>

</body>

</html>
